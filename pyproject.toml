[project]
name = "kwazii"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "agno>=2.2.13",
    "arize-phoenix-otel>=0.13.1",
    "chromadb>=1.3.4",
    "faiss-cpu>=1.12.0",
    "fastmcp>=2.13.1",
    "google-adk==1.18.0",
    "huggingface-hub",
    "ipykernel>=6.30.1",
    "litellm>=1.80.0",
    "marisa-trie>=1.3.1",
    "muvfde>=0.0.9",
    "numpy",
    "openai>=2.8.0",
    "openinference-instrumentation-google-adk>=0.1.6",
    "pandas>=2.3.3",
    "peft>=0.18.0",
    "pillow>=12.0.0",
    "pydantic>=2.12.3",
    "pytest>=9.0.1",
    "requests",
    "scipy>=1.16.1",
    "torch==2.6.0",
    "torchvision>=0.21.0",
    "tqdm",
    "transformers==4.57.1",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["asmr/src", "examples/agno"]

[project.optional-dependencies]
flash-attn = ["flash-attn>=2.5.0"]

[dependency-groups]
dev = [
    "torch==2.6.0",
    "pydantic>=2.12.3",
    "transformers>=4.57.1",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src", "examples/agno/tests"]
pythonpath = [".", "src", "examples/agno"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
