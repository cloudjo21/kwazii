[project]
name = "kwazii"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.12.0",
    "ipykernel>=6.30.1",
    "marisa-trie>=1.3.1",
    "muvfde>=0.0.9",
    "pillow>=12.0.0",
    "pydantic>=2.12.3",
    "scipy>=1.16.1",
    "torch==2.3.0+cu121",
    "transformers>=4.0.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["asmr/src"]

[dependency-groups]
dev = [
    "pydantic>=2.12.3",
]
